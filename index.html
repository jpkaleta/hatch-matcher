<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WNC Hatch Matcher</title>
<style>
  :root {
    --bg:#0f1a0f;--bg2:#162016;--bg3:#1c2a1c;--card:#1a241a;
    --border:#2a3d2a;--border2:#3a5a3a;--green:#4a9a5a;--green2:#6ab87a;
    --green3:#8dd49a;--amber:#c8882a;--amber2:#e8a84a;--text:#d8e8d8;
    --text2:#8aaa8a;--text3:#5a7a5a;--warnbg:#2a1a0a;--okbg:#0a2a0a;--ok:#4a8a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Georgia',serif;min-height:100vh;}
  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:baseline;gap:12px;}
  header h1{font-size:18px;font-weight:normal;letter-spacing:.08em;color:var(--green3);}
  header span{font-size:11px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;}
  .container{padding:16px 16px 40px;max-width:700px;margin:0 auto;}
  .section-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
  .cond-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;}
  .cond-group{display:flex;flex-direction:column;gap:5px;}
  .cond-group .clabel{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;}
  .cond-pills{display:flex;gap:4px;flex-wrap:wrap;}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);cursor:pointer;background:transparent;font-family:'Georgia',serif;transition:all .15s;}
  .pill:hover{border-color:var(--green);color:var(--green3);}
  .pill.active{background:var(--green);border-color:var(--green);color:#fff;}
  .bug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:16px;}
  .bug-card{padding:10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);transition:border-color .15s;}
  .bug-card:hover{border-color:var(--border2);}
  .bug-card.selected{border-color:var(--green);background:var(--bg3);}
  .bug-card.dimmed{opacity:.3;}
  .bug-card .bname{font-size:12px;color:var(--text);}
  .bug-card.selected .bname{color:var(--green3);}
  .bug-card .bsub{font-size:10px;color:var(--text3);margin-top:2px;font-style:italic;}
  .bug-card .bnow{font-size:9px;color:var(--green2);margin-top:4px;letter-spacing:.08em;}
  .bug-card .binbox{font-size:9px;color:var(--green3);margin-top:2px;letter-spacing:.08em;}
  .detail{border:1px solid var(--border2);border-radius:6px;padding:16px;background:var(--card);}
  .detail h2{font-size:16px;font-weight:normal;color:var(--green3);margin-bottom:2px;}
  .detail .latin{font-size:11px;color:var(--text3);font-style:italic;margin-bottom:12px;}
  .month-bar{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-bottom:2px;}
  .mc{height:5px;border-radius:1px;background:var(--border);}
  .mc.on{background:var(--green);}
  .mc.now{outline:1px solid var(--green3);}
  .month-labels{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-bottom:12px;}
  .month-labels span{font-size:8px;color:var(--text3);text-align:center;}
  .cond-note{font-size:12px;padding:8px 10px;border-radius:4px;margin-bottom:12px;line-height:1.5;}
  .cond-note.ok{background:var(--okbg);color:var(--ok);border-left:2px solid var(--ok);}
  .cond-note.warn{background:var(--warnbg);color:var(--amber2);border-left:2px solid var(--amber);}
  .cond-note.neutral{background:var(--bg2);color:var(--text2);border-left:2px solid var(--border2);}
  .stage-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
  .stage-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border2);cursor:pointer;background:transparent;color:var(--text2);font-family:'Georgia',serif;transition:all .15s;}
  .stage-btn:hover{border-color:var(--green);color:var(--green3);}
  .stage-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
  .fly-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;}
  .fly-item:last-child{border-bottom:none;}
  .fly-img{width:80px;height:60px;object-fit:cover;border-radius:4px;border:1px solid var(--border2);flex-shrink:0;background:var(--bg2);}
  .fly-img-placeholder{width:80px;height:60px;border-radius:4px;border:1px solid var(--border);flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text3);text-align:center;padding:4px;}
  .fly-info{flex:1;}
  .fly-header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;}
  .fly-name{font-size:13px;color:var(--text);}
  .fly-size{font-size:11px;color:var(--text3);}
  .in-box{font-size:9px;background:var(--green);color:#fff;padding:2px 6px;border-radius:10px;letter-spacing:.06em;}
  .fly-note{font-size:11px;color:var(--text2);line-height:1.5;}
  .rivers-row{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.8;}
  .rivers-row strong{color:var(--text2);}
  .tip-row{margin-top:10px;padding:8px 10px;background:var(--bg2);border-radius:4px;font-size:11px;color:var(--text2);line-height:1.6;border-left:2px solid var(--border2);}
  .tip-row strong{color:var(--green2);}
  .peak-row{font-size:11px;color:var(--text2);margin-bottom:10px;}
  .peak-row strong{color:var(--text3);}
  #placeholder{text-align:center;padding:32px 16px;color:var(--text3);font-size:13px;font-style:italic;}
</style>
</head>
<body>
<header>
  <h1>WNC Hatch Matcher</h1>
  <span>Watauga · Ashe · Avery Counties</span>
</header>
<div class="container">
  <div class="section-label">Water conditions</div>
  <div class="cond-row">
    <div class="cond-group">
      <div class="clabel">Clarity</div>
      <div class="cond-pills">
        <button class="pill" id="c-clear" onclick="toggleCond('clarity','clear')">Clear</button>
        <button class="pill" id="c-stained" onclick="toggleCond('clarity','stained')">Stained</button>
        <button class="pill" id="c-turbid" onclick="toggleCond('clarity','turbid')">Turbid</button>
      </div>
    </div>
    <div class="cond-group">
      <div class="clabel">Flow</div>
      <div class="cond-pills">
        <button class="pill" id="c-low" onclick="toggleCond('flow','low')">Low</button>
        <button class="pill" id="c-normal" onclick="toggleCond('flow','normal')">Normal</button>
        <button class="pill" id="c-high" onclick="toggleCond('flow','high')">High</button>
      </div>
    </div>
    <div class="cond-group">
      <div class="clabel">Temp</div>
      <div class="cond-pills">
        <button class="pill" id="c-cold" onclick="toggleCond('temp','cold')">&lt;50°F</button>
        <button class="pill" id="c-cool" onclick="toggleCond('temp','cool')">50–65°F</button>
        <button class="pill" id="c-warm" onclick="toggleCond('temp','warm')">&gt;65°F</button>
      </div>
    </div>
  </div>

  <div class="section-label">Select a hatch</div>
  <div class="bug-grid" id="bug-grid"></div>
  <div id="detail-panel"><div id="placeholder">Tap a hatch above to see fly patterns, life stages, and your local waters.</div></div>
</div>

<script>
const MONTHS=['J','F','M','A','M','J','J','A','S','O','N','D'];
const NOW=new Date().getMonth();
const IMG='flies/';

const bugs=[

const conds={clarity:null,flow:null,temp:null};
let selectedBug=null,selectedStage=null;

function toggleCond(type,val){
  const el=document.getElementById('c-'+val);
  if(conds[type]===val){conds[type]=null;el.classList.remove('active');}
  else{
    if(conds[type])document.getElementById('c-'+conds[type]).classList.remove('active');
    conds[type]=val;el.classList.add('active');
  }
  renderGrid();if(selectedBug)renderDetail();
}

function bugMatches(bug){
  if(!conds.clarity&&!conds.flow&&!conds.temp)return true;
  let ok=true;
  if(conds.clarity&&!bug.condMatch.clarity.includes(conds.clarity))ok=false;
  if(conds.flow&&!bug.condMatch.flow.includes(conds.flow))ok=false;
  if(conds.temp&&!bug.condMatch.temp.includes(conds.temp))ok=false;
  return ok;
}

function bugHasInventory(bug){
  return Object.values(bug.stages).some(flies=>flies.some(f=>f.img));
}

function renderGrid(){
  const hasConds=conds.clarity||conds.flow||conds.temp;
  document.getElementById('bug-grid').innerHTML=bugs.map(bug=>{
    const active=bug.months.includes(NOW);
    const matches=bugMatches(bug);
    const sel=selectedBug&&selectedBug.id===bug.id;
    const hasInv=bugHasInventory(bug);
    let cls='bug-card';
    if(sel)cls+=' selected';
    if(hasConds&&!matches)cls+=' dimmed';
    return `<div class="${cls}" onclick="selectBug('${bug.id}')">
      <div class="bname">${bug.name}</div>
      <div class="bsub">${bug.latin.split(' ')[0]}</div>
      ${active?'<div class="bnow">&#9679; hatching now</div>':''}
      ${hasInv?'<div class="binbox">&#10003; in your box</div>':''}
    </div>`;
  }).join('');
}

function selectBug(id){
  selectedBug=bugs.find(b=>b.id===id);
  selectedStage=Object.keys(selectedBug.stages)[0];
  renderGrid();renderDetail();
}

function selectStage(s){selectedStage=s;renderDetail();}

function renderDetail(){
  if(!selectedBug)return;
  const bug=selectedBug;
  const hasConds=conds.clarity||conds.flow||conds.temp;
  const matches=bugMatches(bug);
  const monthBar=MONTHS.map((m,i)=>`<div class="mc${bug.months.includes(i)?' on':''}${i===NOW?' now':''}"></div>`).join('');
  const monthLabels=MONTHS.map(m=>`<span>${m}</span>`).join('');
  let condCls='neutral';
  if(hasConds)condCls=matches?'ok':'warn';
  const condPrefix=hasConds?(matches?'&#10003; ':'&#9651; '):'';
  const stages=Object.keys(bug.stages);
  const stageBtns=stages.map(s=>`<button class="stage-btn${s===selectedStage?' active':''}" onclick="selectStage('${s}')">${s}</button>`).join('');
  const flies=bug.stages[selectedStage]||[];
  const flyHtml=flies.map(f=>`
    <div class="fly-item">
      ${f.img
        ? `<img class="fly-img" src="${IMG}${f.img}" alt="${f.name}" onerror="this.style.display='none'">`
        : `<div class="fly-img-placeholder">not in<br>your box</div>`
      }
      <div class="fly-info">
        <div class="fly-header">
          <span class="fly-name">${f.name}</span>
          <span class="fly-size">${f.size}</span>
          ${f.img?'<span class="in-box">&#10003; in box</span>':''}
        </div>
        <div class="fly-note">${f.note}</div>
      </div>
    </div>`).join('');

  document.getElementById('detail-panel').innerHTML=`
    <div class="detail">
      <h2>${bug.name}</h2>
      <div class="latin">${bug.latin}</div>
      <div class="month-bar">${monthBar}</div>
      <div class="month-labels">${monthLabels}</div>
      <div class="peak-row"><strong>Peak:</strong> ${bug.peak}</div>
      <div class="cond-note ${condCls}">${condPrefix}${bug.condNote}</div>
      <div class="stage-row">${stageBtns}</div>
      <div>${flyHtml}</div>
      <div class="rivers-row"><strong>Your waters:</strong><br>${bug.rivers.join(' &middot; ')}</div>
      <div class="tip-row"><strong>Tip:</strong> ${bug.tip}</div>
    </div>`;
}

renderGrid();
</script>
