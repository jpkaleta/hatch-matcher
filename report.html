<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fly Report — Above the Hatch</title>
<style>
  :root{--bg:#0f1a0f;--bg2:#162016;--bg3:#1c2a1c;--card:#1a241a;--border:#2a3d2a;--border2:#3a5a3a;--green:#4a9a5a;--green2:#6ab87a;--green3:#8dd49a;--amber:#c8882a;--amber2:#e8a84a;--text:#d8e8d8;--text2:#8aaa8a;--text3:#5a7a5a;--warnbg:#2a1a0a;--okbg:#0a2a0a;--ok:#4a8a4a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Georgia',serif;min-height:100vh;}
  nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;position:relative;}
  .hamburger{background:none;border:none;cursor:pointer;padding:14px 4px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
  .hamburger span{display:block;width:20px;height:2px;background:var(--green2);border-radius:1px;transition:background .15s;}
  .hamburger:hover span{background:var(--green3);}
  .nav-brand{font-size:15px;font-weight:normal;color:var(--green3);letter-spacing:.06em;display:flex;flex-direction:column;gap:1px;}
  .nav-brand-sub{font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;}
  .nav-dropdown{display:none;position:absolute;top:100%;left:0;background:var(--bg2);border:1px solid var(--border2);border-top:none;border-radius:0 0 6px 6px;min-width:160px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .nav-dropdown.open{display:block;}
  .nav-dropdown a{display:block;padding:12px 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);text-decoration:none;border-bottom:1px solid var(--border);transition:all .15s;}
  .nav-dropdown a:last-child{border-bottom:none;}
  .nav-dropdown a:hover{color:var(--green3);background:var(--bg3);}
  .nav-dropdown a.active{color:var(--green3);}
  
  .container{padding:20px 16px 60px;max-width:700px;margin:0 auto;}
  .page-title{font-size:13px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
  .page-sub{font-size:12px;color:var(--text3);font-style:italic;margin-bottom:32px;line-height:1.6;}
  
  .page-header{margin-bottom:20px;}
  .page-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--green2);margin-bottom:4px;}
  .page-updated{font-size:11px;color:var(--text3);}
  .page-source{font-size:11px;color:var(--text3);}
  .page-source a{color:var(--green2);text-decoration:none;}
  .section{margin-bottom:24px;}
  .section-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .conditions-box{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:14px;font-size:13px;color:var(--text2);line-height:1.6;}
  .cond-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .cond-pill{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--green);color:#fff;border:1px solid var(--green);}
  .fly-list{display:flex;flex-direction:column;gap:12px;}
  .fly-item{display:flex;gap:14px;align-items:flex-start;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:6px;}
  .fly-img{width:80px;height:58px;object-fit:contain;border-radius:4px;background:var(--bg2);border:1px solid var(--border2);flex-shrink:0;}
  .fly-img-ph{width:80px;height:58px;border-radius:4px;background:var(--bg2);border:1px dashed var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text3);}
  .fly-info{flex:1;}
  .fly-name{font-size:14px;color:var(--text);}
  .fly-size{font-size:11px;color:var(--text3);margin-left:6px;}
  .fly-note{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;}
  .tactic-list{display:flex;flex-direction:column;gap:6px;}
  .tactic{font-size:12px;color:var(--text2);padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:4px;line-height:1.5;}
  .tactic::before{content:'→ ';color:var(--green2);}
  .water-list{display:flex;flex-direction:column;gap:10px;}
  .water-item{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:6px;}
  .water-name{font-size:13px;color:var(--green3);margin-bottom:4px;}
  .water-note{font-size:12px;color:var(--text2);line-height:1.5;}
  .elev-note{font-size:11px;color:var(--text3);font-style:italic;padding:10px 12px;background:var(--bg2);border-radius:4px;border-left:2px solid var(--border2);line-height:1.6;}
  .stocking-alert{background:var(--warnbg);border:1px solid var(--amber);border-radius:6px;padding:12px 14px;font-size:12px;color:var(--amber2);line-height:1.6;}
  .stocking-alert strong{color:var(--amber2);}
  .loading{text-align:center;padding:40px;color:var(--text3);font-style:italic;font-size:13px;}
  .error{text-align:center;padding:40px;color:var(--text3);font-size:13px;}
  .ai-disclaimer{margin-top:28px;padding:10px 12px;font-size:10px;color:var(--text3);line-height:1.6;border-top:1px solid var(--border);text-align:center;letter-spacing:.02em;}
</style>
</head>
<body>
<nav>
  <button class="hamburger" onclick="toggleMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-brand">
    Above the Hatch
    <span class="nav-brand-sub">Watauga &middot; Ashe &middot; Avery</span>
  </div>
  <div class="nav-dropdown" id="nav-dropdown">
    <a href="index.html">Matcher</a>
    <a href="report.html" class="active">Report</a>
    <a href="glossary.html">Glossary</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div class="container">
  <div class="page-title">Current Conditions &amp; Fly Report</div>
  <div class="page-sub">A fly fishing resource for the High Country — built in Boone, NC.</div>
  
  <div id="report-content"><div class="loading">Loading current report...</div></div>
</div>

<script>
function toggleMenu(){
  document.getElementById('nav-dropdown').classList.toggle('open');
}
document.addEventListener('click',function(e){
  if(!e.target.closest('nav'))document.getElementById('nav-dropdown').classList.remove('open');
});

const IMG='flies/';

async function loadReport(){
  const el=document.getElementById('report-content');
  try{
    const res=await fetch('report.json?v='+Date.now());
    if(!res.ok)throw new Error('not found');
    const r=await res.json();

    const condLabels={flow:{low:'Low Flow',normal:'Normal Flow',high:'High Flow'},clarity:{clear:'Clear',stained:'Stained',turbid:'Turbid'},temp:{cold:'Cold (<50°F)',cool:'Cool (50–65°F)',warm:'Warm (>65°F)'}};
    const pills=['clarity','flow','temp'].filter(k=>r.conditions[k]).map(k=>`<span class="cond-pill">${condLabels[k][r.conditions[k]]}</span>`).join('');

    const flies=(r.top_flies||[]).map(f=>{
      const imgEl=f.img
        ?`<img class="fly-img" src="${IMG}${f.img}" alt="${f.name}" onerror="this.outerHTML='<div class=\\'fly-img-ph\\'>no image</div>'">`
        :`<div class="fly-img-ph">no image</div>`;
      return`<div class="fly-item">
        ${imgEl}
        <div class="fly-info">
          <span class="fly-name">${f.name}</span><span class="fly-size">${f.size}</span>
          <div class="fly-note">${f.note}</div>
        </div>
      </div>`;
    }).join('');

    const tactics=(r.tactics||[]).map(t=>`<div class="tactic">${t}</div>`).join('');
    const waters=(r.waters||[]).map(w=>`<div class="water-item"><div class="water-name">${w.name}</div><div class="water-note">${w.note}</div></div>`).join('');
    const stockingHtml=r.stocking_alert?`<div class="section"><div class="stocking-alert"><strong>&#9651; Stocking Alert:</strong> ${r.stocking_note}</div></div>`:'';
    const elevHtml=r.elevation_note?`<div class="section"><div class="elev-note">&#9651; ${r.elevation_note}</div></div>`:'';

    el.innerHTML=`
      <div class="page-header">
        <div class="page-updated">Updated ${r.updated}</div>
        <div class="page-source">Source: <a href="${r.source_url}" target="_blank">${r.source}</a></div>
      </div>

      <div class="section">
        <div class="section-label">Conditions</div>
        <div class="conditions-box">
          ${r.conditions.overall}
          ${pills?`<div class="cond-pills">${pills}</div>`:''}
        </div>
      </div>

      ${stockingHtml}

      <div class="section">
        <div class="section-label">What's Working Now</div>
        <div class="fly-list">${flies}</div>
      </div>

      <div class="section">
        <div class="section-label">Tactics</div>
        <div class="tactic-list">${tactics}</div>
      </div>

      <div class="section">
        <div class="section-label">Waters</div>
        <div class="water-list">${waters}</div>
      </div>

      ${elevHtml}

      <div class="ai-disclaimer">
        This report is AI-synthesized from Due South Outfitters, Fly Life Outdoors, and FlyFishingNC.
        Conditions change fast — always verify locally before heading out.
        <br>For the most current intel, call DSO directly at (828) 355-9109 or visit
        <a href="https://duesouthoutfitters.com/due-south-outfitters-fly-fishing-report/" target="_blank" style="color:var(--green2)">duesouthoutfitters.com</a>.
      </div>`;

  } catch(e){
    el.innerHTML=`<div class="error">No report available right now. Check back after the next DSO update.<br><br><a href="https://duesouthoutfitters.com/due-south-outfitters-fly-fishing-report/" style="color:var(--green2)">Read the latest DSO report directly →</a></div>`;
  }
}

loadReport();
</script>
</body>
</html>
