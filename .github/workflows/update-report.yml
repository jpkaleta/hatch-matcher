name: Update Fishing Report

on:
  schedule:
    - cron: '0 3 * * *'   # runs at 11 PM ET (3 AM UTC) every night
  workflow_dispatch:        # lets you trigger it manually from GitHub UI anytime

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # required to commit report.json back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4

      - name: Run report updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/update_report.py

      - name: Commit changes if report updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report.json .github/scripts/report_hashes.json
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Auto-update fishing report $(date -u +%Y-%m-%d)"
          git push
